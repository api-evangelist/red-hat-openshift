naftiko: 1.0.0-alpha2
info:
  label: Red Hat OpenShift Cluster Manager API — Add-ons
  description: 'Red Hat OpenShift Cluster Manager API — Add-ons. 2 operations. Lead operation: List Cluster Add-ons. Self-contained
    Naftiko capability covering one Red Hat Openshift business surface.'
  tags:
  - Red Hat Openshift
  - Add-ons
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_OPENSHIFT_API_KEY: RED_HAT_OPENSHIFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: cluster-manager-add-ons
    baseUri: https://api.openshift.com
    description: Red Hat OpenShift Cluster Manager API — Add-ons business capability. Self-contained, no shared references.
    resources:
    - name: api-clusters_mgmt-v1-clusters-cluster_id-addons
      path: /api/clusters_mgmt/v1/clusters/{cluster_id}/addons
      operations:
      - name: listclusteraddons
        method: GET
        description: List Cluster Add-ons
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: installclusteraddon
        method: POST
        description: Install Cluster Add-on
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.RED_HAT_OPENSHIFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: cluster-manager-add-ons-rest
    port: 8080
    description: REST adapter for Red Hat OpenShift Cluster Manager API — Add-ons. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/clusters-mgmt/v1/clusters/{cluster-id}/addons
      name: api-clusters-mgmt-v1-clusters-cluster-id-addons
      description: REST surface for api-clusters_mgmt-v1-clusters-cluster_id-addons.
      operations:
      - method: GET
        name: listclusteraddons
        description: List Cluster Add-ons
        call: cluster-manager-add-ons.listclusteraddons
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: installclusteraddon
        description: Install Cluster Add-on
        call: cluster-manager-add-ons.installclusteraddon
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cluster-manager-add-ons-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat OpenShift Cluster Manager API — Add-ons. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-cluster-add-ons
      description: List Cluster Add-ons
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cluster-manager-add-ons.listclusteraddons
      outputParameters:
      - type: object
        mapping: $.
    - name: install-cluster-add
      description: Install Cluster Add-on
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cluster-manager-add-ons.installclusteraddon
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
