apis:
- aid: red-hat-openshift:openshift-pipelines-api
  name: Red Hat OpenShift Pipelines (Tekton) API
  description: >-
    OpenShift Pipelines is a cloud-native CI/CD solution based on Tekton that runs pipelines as Kubernetes-native
    CRDs. The API provides resources for defining Tasks (individual steps), Pipelines (task graphs), PipelineRuns
    (pipeline executions), TaskRuns, Workspaces, TriggerTemplates, and EventListeners for event-driven
    pipeline automation. All pipeline resources are managed through the Kubernetes API server using the
    tekton.dev API group.
  humanURL: >-
    https://docs.openshift.com/container-platform/latest/cicd/pipelines/understanding-openshift-pipelines.html
  baseURL: https://api.cluster.example.com:6443/apis/tekton.dev/v1
  tags:
  - CI/CD
  - Kubernetes
  - Pipelines
  - Tekton
  properties:
  - type: Documentation
    url: >-
      https://docs.openshift.com/container-platform/latest/cicd/pipelines/understanding-openshift-pipelines.html
  - type: GitHub
    url: https://github.com/openshift/pipelines-as-code
- aid: red-hat-openshift:openshift-gitops-api
  name: Red Hat OpenShift GitOps (ArgoCD) API
  description: >-
    OpenShift GitOps is built on Argo CD and provides a GitOps continuous delivery solution for OpenShift
    clusters. The API exposes Application, AppProject, ApplicationSet, and Repository CRD resources for
    declarative cluster state management from Git repositories. The ArgoCD API also includes a REST gRPC-gateway
    API for direct interaction with the ArgoCD server.
  humanURL: >-
    https://docs.openshift.com/container-platform/latest/cicd/gitops/understanding-openshift-gitops.html
  baseURL: https://api.cluster.example.com:6443/apis/argoproj.io/v1alpha1
  tags:
  - ArgoCD
  - CI/CD
  - GitOps
  - Kubernetes
  properties:
  - type: Documentation
    url: >-
      https://docs.openshift.com/container-platform/latest/cicd/gitops/understanding-openshift-gitops.html
  - type: GitHub
    url: https://github.com/openshift/gitops-operator
- aid: red-hat-openshift:openshift-service-mesh-api
  name: Red Hat OpenShift Service Mesh API
  description: >-
    Red Hat OpenShift Service Mesh, based on Istio, Kiali, Jaeger, and Prometheus, provides traffic management,
    security, and observability for microservices. The Service Mesh API exposes Istio CRDs including VirtualService,
    DestinationRule, ServiceEntry, Gateway, PeerAuthentication, AuthorizationPolicy, and Telemetry resources
    for configuring service-to-service communication, mutual TLS, and distributed tracing policies.
  humanURL: https://docs.openshift.com/container-platform/latest/service_mesh/v2x/ossm-about.html
  baseURL: https://api.cluster.example.com:6443/apis/networking.istio.io/v1beta1
  tags:
  - Istio
  - Kubernetes
  - Service Mesh
  - Traffic Management
  properties:
  - type: Documentation
    url: https://docs.openshift.com/container-platform/latest/service_mesh/v2x/ossm-about.html
- aid: red-hat-openshift:openshift-serverless-api
  name: Red Hat OpenShift Serverless (Knative) API
  description: >-
    OpenShift Serverless, based on Knative, enables deploying and managing event-driven serverless workloads
    on OpenShift. The Serverless API exposes Knative Serving resources (Service, Route, Configuration,
    Revision) for auto-scaling workloads and Knative Eventing resources (Broker, Trigger, Channel, Subscription,
    EventSource) for event-driven architectures. Resources are managed through the serving.knative.dev
    and eventing.knative.dev API groups.
  humanURL: https://docs.openshift.com/serverless/latest/about/about-serverless.html
  baseURL: https://api.cluster.example.com:6443/apis/serving.knative.dev/v1
  tags:
  - Event-Driven
  - Knative
  - Kubernetes
  - Serverless
  properties:
  - type: Documentation
    url: https://docs.openshift.com/serverless/latest/about/about-serverless.html
- aid: red-hat-openshift:rosa-api
  name: Red Hat OpenShift Service on AWS (ROSA) API
  description: >-
    Red Hat OpenShift Service on AWS (ROSA) is a fully managed OpenShift service co-managed by Red Hat
    and AWS. The ROSA API, exposed through the OCM service, provides operations for creating and managing
    ROSA clusters, configuring machine pools, managing identity providers, setting up private link connectivity,
    and monitoring cluster status. ROSA clusters also expose the full OpenShift API endpoint after provisioning.
  humanURL: https://docs.openshift.com/rosa/rosa_architecture/rosa-understanding.html
  baseURL: https://api.openshift.com/api/clusters_mgmt/v1
  tags:
  - AWS
  - Cloud
  - Managed Service
  - OpenShift
  properties:
  - type: Documentation
    url: https://docs.openshift.com/rosa/rosa_architecture/rosa-understanding.html
  - type: GettingStarted
