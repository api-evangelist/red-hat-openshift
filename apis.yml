aid: red-hat-openshift
name: Red Hat OpenShift
description: Red Hat OpenShift is an enterprise Kubernetes platform that provides a consistent hybrid
  cloud foundation for building, deploying, and scaling containerized applications. OpenShift extends
  Kubernetes with developer productivity tools, built-in CI/CD pipelines, integrated monitoring and logging,
  automated cluster management, role-based access control, and security policies. It supports deployments
  on bare metal, virtual machines, public clouds, and managed OpenShift services (ROSA, ARO, RHOIC). The
  OpenShift REST API exposes hundreds of Kubernetes and OpenShift-specific resource types organized into
  API groups for workload management, networking, storage, security, builds, pipelines, and cluster configuration.
